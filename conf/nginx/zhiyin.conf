upstream zhiyin_backend {
    server zhiyin-fastapi:8000;
}

server {
    listen 8083;
    server_name _;

    access_log /var/log/nginx/zhiyin_access.log;
    error_log  /var/log/nginx/zhiyin_error.log;

    location / {
        proxy_pass http://zhiyin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
