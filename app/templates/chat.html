{% extends "base.html" %}
{% block content %}
<main class="container">
  <div id="stream" class="stream">
    <div class="empty-state" id="empty-state">
      <p style="text-align:center;font-size:15px;color:#1a3a6b;margin:24px 0 4px;">👋 欢迎来到知音</p>
      <p style="text-align:center;font-size:13px;color:#5c6675;margin:0;">你的研究交给知音。从下方选一条试试，或直接输入。</p>
    </div>
  </div>
  <div id="demo-bar" class="demo-bar">
    <span style="font-size:12px;color:#aab4c0;flex-shrink:0;margin-right:4px;">试试：</span>
    <span class="demo-chip" onclick="fillInput('宁王这波断板了还能拿吗')" title="词典消解 + 画像注入 → 零澄清直出规格">🔵 熟客 · 宁王断板</span>
    <span class="demo-chip" onclick="fillInput('贵州茅台最新收盘价是多少')" title="规则直答 → 不打扰">🔵 直答 · 茅台收盘价</span>
    <span class="demo-chip" onclick="fillInput('明天哪只股票能涨停')" title="边界卡转译 → 拒答不冷场">🟡 合规 · 涨停预测</span>
    <span class="demo-chip" onclick="fillInput('帮我盯着新易盛的减持公告，有动静告诉我')" title="四要素委托 → 持续盯盘 → 简报汇报">🟢 委托 · 盯减持公告</span>
  </div>
  <div id="composer" class="composer">
    <input class="composer-input form-input" type="text" maxlength="2000" placeholder="输入问题或委托任务，Enter 发送">
    <span class="composer-count">0/2000</span>
    <button class="composer-send btn btn--primary">发送</button>
  </div>
</main>
<script>
function fillInput(text) {
  var input = document.querySelector('.composer-input');
  if (input) { input.value = text; input.dispatchEvent(new Event('input')); input.focus(); }
  var es = document.getElementById('empty-state');
  if (es) es.style.display = 'none';
}
</script>
{% endblock %}
