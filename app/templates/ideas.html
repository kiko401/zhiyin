{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom:8px;">点子</h2>
<p style="color:#5c6675;font-size:13px;margin-bottom:16px;">预设规格起点，选标的即预填，一键委托。</p>
<div id="ideas-grid"></div>
<div id="idea-launch" style="display:none;margin-top:16px;">
  <section class="card card--spec">
    <strong>确认研究</strong>
    <p id="idea-desc" style="font-size:13px;color:#5c6675;margin:8px 0 4px;"></p>
    <div class="field-row" style="display:flex;gap:8px;align-items:center;margin:8px 0;">
      <span style="min-width:60px;font-weight:600;">标的</span>
      <input id="idea-ticker" class="form-input" style="flex:1;" placeholder="输入代码或名称，如 300502.SZ 或 新易盛">
    </div>
    <button class="btn btn--primary" id="idea-confirm" onclick="confirmIdea()">发起研究</button>
  </section>
</div>
<script>
var currentIdea = null;
fetch('/api/ideas').then(function(r){return r.json()}).then(function(d){
  var ideas = d.data || []; var wrap = document.getElementById('ideas-grid');
  ideas.forEach(function(idea) {
    var card = document.createElement('section'); card.className = 'card'; card.style.marginBottom = '8px'; card.style.cursor = 'pointer';
    card.innerHTML = '<strong>' + idea.name + '</strong>' +
      (idea.ifind_dependent ? ' <span class="badge badge--inferred">需 iFinD</span>' : '') +
      '<p style="font-size:13px;color:#5c6675;margin:4px 0 0;">' + (idea.description || '') + '</p>' +
      '<p style="font-size:12px;color:#aab4c0;margin:2px 0 0;">适用：' + (idea.audience || '') + '</p>';
    card.addEventListener('click', function() { selectIdea(idea); });
    wrap.appendChild(card);
  });
});
function selectIdea(idea) {
  currentIdea = idea;
  document.getElementById('idea-launch').style.display = 'block';
  document.getElementById('idea-desc').textContent = idea.description || '';
  document.getElementById('idea-ticker').value = '';
  document.getElementById('idea-launch').scrollIntoView({block:'center'});
}
function confirmIdea() {
  if (!currentIdea) return;
  var ticker = document.getElementById('idea-ticker').value.trim();
  if (!ticker && currentIdea.required_input === 'ticker') { alert('请输入标的'); return; }
  fetch('/api/idea/' + currentIdea.id + '/launch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ticker: ticker})})
    .then(function(r){return r.json()}).then(function(d){
      if (d.code === 0 && d.data.spec_uid) {
        return fetch('/api/spec/' + d.data.spec_uid + '/confirm', {method:'POST'}).then(function(r){return r.json()}).then(function(cd){
          if (cd.code === 0) { alert('研究已启动，回到对话页查看工作卡与回答。'); location.href = '/'; }
          else alert(cd.message || '启动失败');
        });
      } else alert(d.message || '发起失败');
    });
}
</script>
{% endblock %}
