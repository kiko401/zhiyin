services:
  zhiyin-fastapi:
    build: .
    image: zhiyin-fastapi:latest
    container_name: zhiyin-fastapi
    restart: unless-stopped
    ports:
      - "8014:8000"
    env_file:
      - .env
    mem_limit: 512m
    cpus: 1.0
    networks:
      - infra_network

networks:
  infra_network:
    external: true
    name: infra_infra_network
