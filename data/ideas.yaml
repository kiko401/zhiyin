# 点子货架：预设规格起点，task_type 与证据蓝图绑定（PRD 2.6）
- id: holding_check
  name: 持有体检
  task_type: decision_support
  description: 对单一持仓做事实面与市场环境面的一轮快速体检
  audience: 持仓一到十只的个人投资者
  required_input: ticker
  ifind_dependent: false
- id: limit_up_review
  name: 涨停复盘
  task_type: limit_up_review
  description: 复盘当日涨停梯队与热榜事实，输出中性复盘
  audience: 关注市场情绪的短线投资者
  required_input: none
  ifind_dependent: false
- id: sector_review
  name: 板块扫描
  task_type: sector_review
  description: 对输入板块做成分、行情与宽度资金扫描
  audience: 做板块比较的投资者
  required_input: sector
  ifind_dependent: true
- id: capital_perspective
  name: 资金透视
  task_type: capital_perspective
  description: 个股资金面与新闻归因的快速透视
  audience: 关注资金动向的投资者
  required_input: ticker
  ifind_dependent: true
- id: earnings_quickread
  name: 财报速读
  task_type: fact_query
  description: 最新一期财报关键科目速读与口径声明
  audience: 财报季集中浏览的投资者
  required_input: ticker
  ifind_dependent: false
- id: trapped_research
  name: 解套研究
  task_type: decision_support
  description: 以被套语境预设的研究框架，给正反论点与风险清单
  audience: 被套中的投资者
  required_input: ticker
  ifind_dependent: false
- id: ipo_open_review
  name: 新股开板复盘
  task_type: limit_up_review
  description: 次新股开板前后的量价事实复盘
  audience: 参与新股交易的投资者
  required_input: ticker
  ifind_dependent: false
- id: index_env_check
  name: 指数环境体检
  task_type: sector_review
  description: 宽基指数的位置、宽度与资金环境体检
  audience: 做仓位决策的投资者
  required_input: index
  ifind_dependent: true
